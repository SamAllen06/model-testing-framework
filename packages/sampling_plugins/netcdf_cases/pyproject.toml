[project]
name = "mtf-netcdf-cases"
version = "1.0.0"
requires-python = ">=3.14,<4.0"
dependencies = [
	"netCDF4>=1.7.2,<2.0",
	"numpy>=2.4.2,<3.0",
	"model-testing-framework @ file:../../mtf",
]

[project.optional-dependencies]
dev = [
	"ruff>=15.4,<16.0",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
