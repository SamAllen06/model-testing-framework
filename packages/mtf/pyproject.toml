[project]
name = "model-testing-framework"
version = "1.0.0"
requires-python = ">=3.14,<4.0"
dependencies = [
	"numpy>=2.4.2,<3.0",
	"netCDF4>=1.7.2,<2.0",
]

[project.optional-dependencies]
dev = [
	"ruff>=15.4,<16.0",
]

[project.scripts]
mtf = "mtf:run_cli"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
